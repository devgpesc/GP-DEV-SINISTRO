<!--
Assunto sugerido: Seu link de acesso ao EventsCar
Cole em: Authentication → Email Templates → Magic Link
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Link</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F1F5F9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border-radius:24px;overflow:hidden;border:1px solid #E2E8F0;">
          <tr>
            <td style="background:#0F172A;padding:28px 32px;">
              <div style="font-size:22px;font-weight:800;color:#FFFFFF;">Events<span style="color:#38BDF8;">Car</span></div>
              <div style="margin-top:6px;font-size:12px;color:#94A3B8;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Acesso seguro</div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 16px;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#0F172A;font-weight:800;">Entrar sem senha</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">
                Use o botao abaixo para acessar o EventsCar com o e-mail <strong>{{ .Email }}</strong>. O link expira por seguranca.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2563EB;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:16px 28px;border-radius:14px;">
                Entrar agora
              </a>
              <p style="margin:28px 0 0;font-size:12px;color:#94A3B8;line-height:1.6;word-break:break-all;">
                Link alternativo: <a href="{{ .ConfirmationURL }}" style="color:#2563EB;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #F1F5F9;">
              <p style="margin:0;font-size:11px;color:#94A3B8;">Se nao foi voce, ignore este e-mail. © EventsCar</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
