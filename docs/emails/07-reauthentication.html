<!--
Assunto sugerido: Codigo de verificacao — EventsCar
Cole em: Authentication → Emails → Reauthentication
Variavel obrigatoria: {{ .Token }}
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reautenticacao</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F1F5F9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border-radius:24px;overflow:hidden;border:1px solid #E2E8F0;">
          <tr>
            <td style="background:#0F172A;padding:28px 32px;">
              <div style="font-size:22px;font-weight:800;color:#FFFFFF;">Events<span style="color:#38BDF8;">Car</span></div>
              <div style="margin-top:6px;font-size:12px;color:#94A3B8;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Verificacao de seguranca</div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 16px;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#0F172A;font-weight:800;">Confirme que e voce</h1>
              <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#475569;">
                Para concluir uma acao sensivel na conta <strong>{{ .Email }}</strong>, use o codigo abaixo:
              </p>
              <div style="margin:0 0 24px;padding:18px 20px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;text-align:center;">
                <div style="font-size:32px;letter-spacing:0.28em;font-weight:800;color:#0F172A;">{{ .Token }}</div>
              </div>
              <p style="margin:0;font-size:13px;line-height:1.6;color:#64748B;">
                O codigo expira em breve. Se voce nao solicitou esta verificacao, ignore este e-mail.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #F1F5F9;">
              <p style="margin:0;font-size:11px;color:#94A3B8;">© EventsCar by Grupo ESC Sistemas</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
