<!--
Assunto sugerido: Voce foi convidado para o EventsCar
Cole em: Authentication → Email Templates → Invite user
Obs.: o convite da EMPRESA (Esc Solutions etc.) e gerado pelo sistema em Configuracoes → Equipe.
Este template e o convite nativo do Supabase Auth (opcional).
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F1F5F9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border-radius:24px;overflow:hidden;border:1px solid #E2E8F0;">
          <tr>
            <td style="background:#0F172A;padding:28px 32px;">
              <div style="font-size:22px;font-weight:800;color:#FFFFFF;">Events<span style="color:#38BDF8;">Car</span></div>
              <div style="margin-top:6px;font-size:12px;color:#94A3B8;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">Convite de acesso</div>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 16px;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#0F172A;font-weight:800;">Voce foi convidado</h1>
              <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#475569;">
                Voce recebeu um convite para acessar a plataforma EventsCar com o e-mail <strong>{{ .Email }}</strong>.
              </p>
              <p style="margin:0 0 28px;font-size:14px;line-height:1.6;color:#64748B;">
                Clique no botao para aceitar e definir seu acesso.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2563EB;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:16px 28px;border-radius:14px;">
                Aceitar convite
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #F1F5F9;">
              <p style="margin:0;font-size:11px;color:#94A3B8;">© EventsCar by Grupo ESC Sistemas</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
